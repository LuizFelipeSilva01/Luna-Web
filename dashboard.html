<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Luna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    
    <!-- JS para deixar o site dinamico e para funcionamento dos gráficos -->
    <script type="module" src="js/dashboard.js"></script>
    <script src="js/menu.js" defer></script>

    <!-- conectando o firebase -->
    <script type="module" src="firebase/proteger.js"></script>
    <script type="module" src="firebase/perfil_adm.js"></script>
</head>

<body class="pagina-admin pagina-dashboard">

  <header>
    <button class="btn-menu" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
  
        <div class="logo">
          <img src="imagens/logo.png" width="38"/>
          Luna
        </div>

        <div class="text-header">
          <h1>Meu Perfil</h1>
          <p>Suas Informações e Atividades no Painel</p>
        </div>

        <a class="usuario-topo" href="perfil_adm.html">
          <img src="imagens/admin.png">
          <div>
            <strong>Admin</strong><br>
            <small>Administrator</small>
          </div>
        </a>

  </header>

  <div class="container">

    <!--Sidebar-->
    <aside class="sidebar">

      <nav>
        <a href="dashboard.html" class="ativo">
          <img src="imagens/dashboard_icon.svg">
          Dashboard
        </a>
        <a href="config_perfil.html">
          <img src="imagens/config_icon.svg">
          Configurações
        </a>
      </nav>

      <div class="rodape-sidebar">
        <a href="home.html"><img src="imagens/back_icon.svg"> Voltar ao site</a>
        <a href="#" id="btn-sair"><img src="imagens/exit_icon.svg"> Sair</a>      
      </div>

    </aside>

    <!--Conteudo principal da pagina-->
<main class="conteudo">

  <div class="cards">
    <div class="card card-lilas">
      <span class="card-title">Usuários totais</span>
      <div class="card-row">
        <span class="number" id="kpi-total">—</span>
        <span class="percent" id="kpi-total-pct" hidden></span>
      </div>
    </div>

    <div class="card card-lilas">
      <span class="card-title">Usuários ativos (30d)</span>
      <div class="card-row">
        <span class="number" id="kpi-ativos">—</span>
        <span class="percent" id="kpi-ativos-pct" hidden></span>
      </div>
    </div>

    <div class="card card-lilas">
      <span class="card-title">Novos usuários (30d)</span>
      <div class="card-row">
        <span class="number" id="kpi-novos">—</span>
        <span class="percent" id="kpi-novos-pct" hidden></span>
      </div>
    </div>

    <div class="card card-lilas">
      <span class="card-title">Retenção (30d)</span>
      <div class="card-row">
        <span class="number" id="kpi-retencao">—</span>
        <span class="percent" id="kpi-retencao-pct" hidden></span>
      </div>
    </div>
  </div>

  <div class="charts">
    <div class="card card-lilas chart-card">
      <div class="chart-title">Crescimento de usuários</div>

      <div class="area-linha">
        <div class="numeros" id="eixo-y"></div>

        <div class="area-grafico">
          <div class="linha-grade linha1"></div>
          <div class="linha-grade linha2"></div>
          <div class="linha-grade linha3"></div>
          <div class="linha-grade linha4"></div>
          <div class="linha-grade linha5"></div>

          <svg class="grafico-linha" viewBox="0 0 500 133" preserveAspectRatio="none">
            <defs>
              <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8a55ed" stop-opacity=".17"/>
                <stop offset="100%" stop-color="#8a55ed" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path id="area-path" d="" fill="url(#area)"/>
            <path id="linha-path" d="" fill="none" stroke="#7939ed"
                  stroke-width="1.6" vector-effect="non-scaling-stroke"/>
          </svg>

          <div class="datas" id="eixo-x"></div>
        </div>
      </div>
    </div>

    <div class="card card-lilas chart-card platform-card">
      <div class="chart-title">Usuários por plataforma</div>

      <div class="grafico" id="donut"></div>

      <div class="linha">
        <div class="nome"><span class="bolinha android"></span>Android</div>
        <span id="pct-android">0%</span>
      </div>
      <div class="linha">
        <div class="nome"><span class="bolinha ios"></span>iOS</div>
        <span id="pct-ios">0%</span>
      </div>
      <div class="linha">
        <div class="nome"><span class="bolinha web"></span>Web</div>
        <span id="pct-web">0%</span>
      </div>
    </div>
  </div>

</main>
  </div>

</body>
</html>
